[package]
name = "lota_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "lota_engine"
path = "src/lib.rs"

[[bin]]
name = "lota-server"
path = "src/main.rs"

[dependencies]
me60os = { path = "/home/jnovoas/Proyectos/sentinel/me-60os-core" }
bytemuck = { version = "1.16", features = ["derive"] }
wgpu = "0.20"
tokio = { version = "1.37", features = ["full"] }
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
