</div>
<div class="flex items-center gap-2 px-3 py-1 bg-surface-container-high border border-outline-variant">

<div class="flex-1 bg-secondary-container progress-segment"></div>
<div class="flex-1 bg-secondary-container progress-segment"></div>

</div>

<h2 class="font-headline-lg-mobile text-headline-lg-mobile uppercase text-on-surface">Reportar Incidencia</h2>
<p class="font-body-md text-on-surface-variant mt-1">Colabora con el mantenimiento de la ciudad indómita.</p>
</header>
<!-- Category Grid -->
<div class="grid grid-cols-2 gap-2 mb-stack-md">
<button class="group bg-surface-container-high border-2 border-outline-variant p-4 flex flex-col items-start gap-4 transition-all hover:border-secondary active:scale-95" onclick="selectCategory(this)">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-secondary" style="font-size: 32px;">delete_outline</span>

</button>
<button class="group bg-surface-container-high border-2 border-outline-variant p-4 flex flex-col items-start gap-4 transition-all hover:border-secondary active:scale-95" onclick="selectCategory(this)">

</button>
<button class="group bg-surface-container-high border-2 border-outline-variant p-4 flex flex-col items-start gap-4 transition-all hover:border-secondary active:scale-95" onclick="selectCategory(this)">

<a class="flex flex-col items-center justify-center text-on-surface-variant p-1" href="#">

<script>
        function selectCategory(btn) {
            // Remove active from all
            document.querySelectorAll('button').forEach(b => {
                b.classList.remove('border-secondary', 'bg-secondary-container/10');
                b.querySelector('span:first-child').classList.remove('text-secondary');
                b.querySelector('span:first-child').style.fontVariationSettings = "'FILL' 0";
            });
            // Add to selected
            btn.classList.add('border-secondary', 'bg-secondary-container/10');
            const icon = btn.querySelector('span:first-child');
            icon.classList.add('text-secondary');
            icon.style.fontVariationSettings = "'FILL' 1";
        }
    </script>
