<body class="bg-background text-on-background font-body-md selection:bg-primary selection:text-on-primary-container overflow-hidden">
<div class="noise-overlay"></div>
<!-- UI Overlay Wrapper -->

</div>
<div class="flex items-center gap-2 bg-surface-container px-3 py-1 border-2 border-outline">
<span class="font-label-sm text-label-sm text-primary">1,250</span>
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="conditions">conditions</span>
</div>
</header>
<!-- Main Map Area (Full Screen) -->
<main class="flex-grow relative bg-[#0e0e0e]">
<!-- Simulated Map Image with Data-Location -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover grayscale opacity-40 mix-blend-luminosity" data-alt="A highly detailed, dark-themed geographical map of a coastal industrial city. The map features high-contrast linework in copper and neon mint, highlighting the rugged terrain of Alto and Bajo sectors. Subtle grid patterns and blueprint schematics are overlaid across the landscape. The atmosphere is moody and technical, reminiscent of a digital archaeology interface with deep coal blacks and metallic textures." data-location="Lota, Chile" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB0Po7PbodWP389ET7pRBbTrZVphklcfZSeNqC4TbyuxyoULshmCX9QeBgsGUwiRU6lt9tzVxkp7D3JXT1kaBrGIZXZXLWdW_Rm9ttedpTWiT9xa4yKUDJuYyPt1ur_aqqHnWvBhvK3sNakIevLsuroXy-C44Q2ehMjUb56FQPAwFsTVdg9aQ9zbGneWBeMmvjCRorhgl4hj2K3Ya_Vy017L5cvGhLHncE8qEFvW2QjgtjAHyjfLyPRajoL9_1YdbDsr-ehYMt2rgDT"/>
<!-- Grid Overlay -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#a88a7e 1px, transparent 1px); background-size: 32px 32px;"></div>
</div>
<!-- Custom Markers (Interactive) -->
<!-- Parque de Lota Marker -->
<div class="absolute top-[35%] left-[45%] group cursor-pointer" onclick="selectPoint('Parque de Lota', 'Monumento Nacional con jardines franceses y estatuas de fierro fundido.')">
<div class="relative flex flex-col items-center">
<div class="w-10 h-10 bg-surface border-2 border-primary rounded-full flex items-center justify-center marker-glow transform group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-xl" data-icon="park" style="font-variation-settings: 'FILL' 1;">park</span>
</div>
<div class="mt-1 px-2 py-0.5 bg-background/80 border border-outline backdrop-blur-sm">
<span class="font-label-sm text-[10px] text-on-surface uppercase">Parque de Lota</span>
</div>
</div>
</div>
<!-- Chiflón del Diablo Marker -->
<div class="absolute top-[60%] left-[30%] group cursor-pointer" onclick="selectPoint('Chiflón del Diablo', 'Mina de carbón submarina, única en el mundo abierta al turismo.')">
<div class="relative flex flex-col items-center">
<div class="w-10 h-10 bg-surface border-2 border-secondary rounded-full flex items-center justify-center marker-glow transform group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-secondary text-xl" data-icon="precision_manufacturing" style="font-variation-settings: 'FILL' 1;">precision_manufacturing</span>
</div>
<div class="mt-1 px-2 py-0.5 bg-background/80 border border-outline backdrop-blur-sm">
<span class="font-label-sm text-[10px] text-on-surface uppercase">Chiflón del Diablo</span>
</div>
</div>
</div>
<!-- Geopoint Marker -->
<div class="absolute top-[50%] left-[70%] group cursor-pointer" onclick="selectPoint('Geositio Piedra Blanca', 'Formación geológica milenaria frente al Océano Pacífico.')">
<div class="relative flex flex-col items-center">
<div class="w-8 h-8 bg-surface border-2 border-tertiary rounded-full flex items-center justify-center marker-glow transform group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-tertiary text-lg" data-icon="landscape" style="font-variation-settings: 'FILL' 1;">landscape</span>
</div>
</div>
</div>
<!-- Map HUD Elements -->
<div class="absolute top-20 right-margin-mobile flex flex-col gap-2 z-10">

</button>
<button class="flex-shrink-0 bg-surface-container text-on-surface-variant px-4 py-2 border-2 border-outline flex items-center gap-2 industrial-shadow">

<span class="font-label-sm text-[11px] font-bold">RUTAS</span>
</button>
<button class="flex-shrink-0 bg-surface-container text-on-surface-variant px-4 py-2 border-2 border-outline flex items-center gap-2 industrial-shadow">
<span class="material-symbols-outlined text-sm" data-icon="store">store</span>
<span class="font-label-sm text-[11px] font-bold">COMERCIO</span>
</button>
</div>
</div>
<!-- Selected Point Overlay (Hidden by default) -->
<div class="absolute bottom-24 left-margin-mobile right-margin-mobile z-30 transition-all duration-300 translate-y-full opacity-0 pointer-events-none" id="pointCard">
<div class="bg-surface border-2 border-outline p-4 industrial-shadow relative overflow-hidden pointer-events-auto">
<div class="coal-texture absolute inset-0"></div>
<div class="relative z-10">

                            Monumento Nacional con jardines franceses y estatuas de fierro fundido.

<button class="w-full bg-primary py-3 flex items-center justify-center gap-2 text-on-primary font-bold active:scale-95 transition-transform">

</div>

<span class="material-symbols-outlined text-2xl" data-icon="explore" style="font-variation-settings: 'FILL' 1;">explore</span>

</div>
<!-- Routes -->

<span class="material-symbols-outlined text-2xl" data-icon="map">map</span>
<span class="font-label-sm text-label-sm">Routes</span>
</div>
<!-- Scan -->

<span class="material-symbols-outlined text-2xl" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="font-label-sm text-label-sm">Scan</span>
</div>
<!-- Profile -->

<span class="material-symbols-outlined text-2xl" data-icon="account_circle">account_circle</span>
<span class="font-label-sm text-label-sm">Profile</span>
</div>
</nav>
</div>
<script>
        function selectPoint(title, desc) {
            const card = document.getElementById('pointCard');
            const cardTitle = document.getElementById('cardTitle');
            const cardDesc = document.getElementById('cardDesc');
            
            cardTitle.innerText = title;
            cardDesc.innerText = desc;
            
            card.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
            card.classList.add('translate-y-0', 'opacity-100');
            
            // Atmospheric micro-interaction: Subtle vibration or sound simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        function closePoint() {
            const card = document.getElementById('pointCard');
            card.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
            card.classList.remove('translate-y-0', 'opacity-100');
        }

        // Simulate some atmospheric "glitch" or data loading effect on markers
        setInterval(() => {
            const markers = document.querySelectorAll('.marker-glow');
            const randomMarker = markers[Math.floor(Math.random() * markers.length)];
            if (randomMarker) {
                randomMarker.style.opacity = '0.7';
                setTimeout(() => randomMarker.style.opacity = '1', 50);
            }
        }, 3000);
    </script>
