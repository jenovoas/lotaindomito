<script>
        function selectRole(roleId) {
            // Reset all cards
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('border-secondary', 'bg-secondary-container/10');
                card.classList.add('bg-surface-container', 'border-outline');
                card.querySelector('.material-symbols-outlined').classList.remove('neon-glow');
            });

            // Select clicked card
            const selectedCard = document.getElementById('role-' + roleId);
            selectedCard.classList.remove('border-outline');
            selectedCard.classList.add('border-secondary', 'bg-secondary-container/10');
            selectedCard.querySelector('.material-symbols-outlined').classList.add('neon-glow');
            
            // Atmospheric feedback
            console.log(`Role ${roleId} initialized.`);
        }

        // Initialize first role as default
        window.onload = () => selectRole('sentry');
    </script>
