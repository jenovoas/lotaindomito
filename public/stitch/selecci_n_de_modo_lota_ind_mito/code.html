<script>
        function selectMode(mode) {
            console.log('Mode selected:', mode);
            // Visual feedback
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-primary z-[100] transition-opacity duration-300 opacity-0 flex items-center justify-center';
            if (mode === 'jugador') overlay.classList.replace('bg-primary', 'bg-secondary');
            
            document.body.appendChild(overlay);
            
            setTimeout(() => {
                overlay.style.opacity = '1';
                setTimeout(() => {
                    // Logic to navigate or transition
                    alert('Has seleccionado: MODO ' + mode.toUpperCase());
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.remove(), 300);
                }, 500);
            }, 10);
        }

        // Mechanical motion simulation on scroll
        window.addEventListener('scroll', () => {
            const grid = document.querySelector('.blueprint-grid');
            const scrolled = window.pageYOffset;
            grid.style.backgroundPositionY = -(scrolled * 0.2) + 'px';
        });
    </script>
