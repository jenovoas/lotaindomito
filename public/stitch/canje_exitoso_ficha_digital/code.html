<script>
        // Atmospheric interaction: slight flicker on the neon elements
        setInterval(() => {
            const glow = document.querySelector('.neon-glow');
            if(glow) {
                glow.style.opacity = Math.random() > 0.98 ? '0.7' : '1';
            }
        }, 100);

        // Click effects for buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.add('opacity-80');
                setTimeout(() => this.classList.remove('opacity-80'), 150);
            });
        });
