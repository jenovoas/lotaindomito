[project]
name = "lota-indomito-backend"
version = "0.1.0"
description = "Backend FastAPI para Lota Indómito — zonas, wallet, NPCs"

requires-python = ">=3.12"
license = {text = "Apache-2.0"}

dependencies = [
    # Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Database — async
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.16.0",
    "alembic>=1.14.0",

    # Validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Utilities
    "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "basedpyright>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint]
target-version = "py312"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "T10",  # debugger
]
ignore = [
    "T201",  # print found — lifespan usa print intencionalmente
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["ALL"]
"tests/*" = ["ALL"]
"alembic/*" = ["ALL"]

[tool.basedpyright]
typeCheckingMode = "all"
reportMissingTypeStubs = false
pythonVersion = "3.12"
